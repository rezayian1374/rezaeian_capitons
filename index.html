<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persian Captions - زیرنویس خودکار فارسی</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <meta name="description" content="Automatic video caption and subtitle generator with full Persian (فارسی) language support, customizable styles, and export.">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F0E26;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 24px;
    }
    .icon {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 10px 0;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid #8B5CF6;
      color: #06B6D4;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/icon-192.png" alt="Persian Captions Logo" class="icon">
    <h1>کپشن‌نویس ویدیوی فارسی</h1>
    <p>تولید خودکار زیرنویس ویدیو به زبان فارسی با هوش مصنوعی و هماهنگی دقیق زمان‌بندی</p>
    <div class="badge">Persian Captions PWA Ready</div>
  </div>
</body>
</html>
